services:
  frontend:
    image: ghcr.io/mouadtaoussi/ai-assistant-frontend:${v1.1.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  backend:
    image: ghcr.io/mouadtaoussi/ai-assistant-backend:${v1.1.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"